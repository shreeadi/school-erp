# Local / single-host deployment of the whole platform.
#   cp .env.example .env && docker compose up --build
# Web: http://localhost:3000   API docs: http://localhost:4000/api/docs
name: school-erp

x-db-env: &db-env
  DATABASE_URL: postgresql://erp_app:${APP_DB_PASSWORD}@postgres:5432/school_erp
  MIGRATION_DATABASE_URL: postgresql://erp_owner:${POSTGRES_PASSWORD}@postgres:5432/school_erp

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: erp_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: school_erp
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_owner -d school_erp"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  # One-shot job: apply migrations, then load synthetic demo data if SEED_DEMO=true.
  migrate:
    image: school-erp-api:local
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      <<: *db-env
      ENABLE_JOBS: "false"
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN}
      SEED_DEMO: ${SEED_DEMO:-true}
    command: ["sh", "-c", "node node_modules/prisma/build/index.js migrate deploy && if [ \"$$SEED_DEMO\" = \"true\" ]; then node dist/prisma/seed.js; fi"]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    image: school-erp-api:local
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      <<: *db-env
      NODE_ENV: ${NODE_ENV:-production}
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: ${WEB_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      AI_SERVICE_URL: http://ai:8000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN}
    ports: ["4000:4000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      retries: 10

  ai:
    image: school-erp-ai:local
    build: { context: services/ai }
    environment:
      DATABASE_URL: postgresql://erp_app:${APP_DB_PASSWORD}@postgres:5432/school_erp
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN}
      LLM_API_KEY: ${LLM_API_KEY:-}
    expose: ["8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    image: school-erp-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args: { API_INTERNAL_URL: http://api:4000 }
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
